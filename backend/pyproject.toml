[project]
name = "ig-request-service"
version = "0.1.0"
description = "Instagram private-API request layer (device fingerprint, nav-chain, reel publish) served over FastAPI and routed through the Go uTLS sidecar."
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "httpx[http2]==0.28.1",
    "pydantic==2.10.4",
    "python-multipart==0.0.20",
]

[tool.uvicorn]
app = "app.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
